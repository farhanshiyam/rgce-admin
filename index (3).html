<title>RGCE Admin Panel</title>

<style>
:root{
  --primary:#1f4e79; --primary-d:#0f2d4a; --gold:#c9a227;
  --bg:#f3f5f8; --panel:#fff; --text:#1b2430; --muted:#5d6b7a; --border:#d7dde5;
  --input-bg:#fff; --danger:#c62828; --success:#1b7f3b; --warn:#b26a00;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1621; --panel:#16212e; --text:#e6edf5; --muted:#9aa9ba; --border:#2a384a;
    --input-bg:#0f1824; --danger:#ef7b7b; --success:#5fcf86; --warn:#e0a24a; --primary:#4f8fc9;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1621; --panel:#16212e; --text:#e6edf5; --muted:#9aa9ba; --border:#2a384a;
  --input-bg:#0f1824; --danger:#ef7b7b; --success:#5fcf86; --warn:#e0a24a; --primary:#4f8fc9;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",Arial,sans-serif;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:linear-gradient(135deg,#0f2d4a,#1f4e79);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-bottom:3px solid var(--gold)}
.top h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.2px}
.top small{display:block;opacity:.8;font-size:12.5px;font-weight:400}
.top .right{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrap{max-width:860px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:18px}
.card h3{margin:18px 0 8px;font-size:15px}
.muted{color:var(--muted);font-size:13.5px}
.center{max-width:430px;margin:48px auto 0}
.fg{margin:0 0 12px}
.fg label{display:block;font-size:13px;font-weight:600;margin:0 0 4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg)}
.fg textarea{min-height:96px;resize:vertical}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:2px solid var(--primary);outline-offset:0;border-color:var(--primary)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--primary)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-danger{color:var(--danger);border-color:var(--danger)}
.btn-sm{padding:5px 10px;font-size:13px}
.top .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.top .btn:hover{background:rgba(255,255,255,.22)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tab{padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-weight:600;font-size:14px}
.tab[aria-selected="true"]{background:var(--primary);color:#fff;border-color:var(--primary)}
.msg{min-height:20px;margin:8px 0;font-size:13.5px;color:var(--danger)}
.msg.ok{color:var(--success)}
.msg.warn{color:var(--warn)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.kv b{font-weight:600}
.kv code{font-size:12px;word-break:break-all}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border)}
.row .t{flex:1 1 240px;min-width:0}
.row .t b{display:block;overflow-wrap:anywhere}
.row .t small{color:var(--muted)}
.row .acts{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--border);color:var(--muted)}
.chip.on{border-color:var(--success);color:var(--success)}
.chk{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:14px}
.chk input{margin-top:4px}
.rules{width:100%;font:12px/1.45 ui-monospace,Consolas,monospace;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);min-height:230px}
.big{font-size:26px;font-weight:700;color:var(--primary)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:520px){.kv{grid-template-columns:1fr}.card{padding:16px 14px}}
</style>
</head>

/* ============ state ============ */
let user = null, unlocked = false, tab = 'notices', booted = false;
let N = { list: [], on: false, editing: '', pubErr: false };
let pwFails = 0, pwLockUntil = 0, idleTimer = 0;
const app = $('#app');

/* ============ password helpers (identical scheme to the main app: salted PBKDF2 hashes in private_config/<uid>) ============ */
const cfgRef = () => doc(db, 'private_config', user.uid);
const b64 = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
  return b64(new Uint8Array(bits));
}
async function makeEntry(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000;
  return { salt, iter, hash: await derive(pw, salt, iter) };
}
async function getFresh(ref) { try { return await getDocFromServer(ref); } catch (e) { if (e && e.code === 'permission-denied') throw e; return await getDoc(ref); } }
/* returns 'ok' | 'bad' | 'nosetup' | 'locked' | 'error' */
async function verifyMaster(input) {
  if (Date.now() < pwLockUntil) return 'locked';
  try {
    if (!(window.crypto && crypto.subtle)) return 'error';
    const snap = await getFresh(cfgRef());
    const d = snap.exists() ? (snap.data() || {}) : {};
    /* same rule as the main app's footer unlock: the "unlock" password; older accounts fall back to their Admin / Master password */
    const e = [d.unlock, d.admin, d.master].find(x => x && x.salt && x.hash);
    if (!e) return 'nosetup';
    const h = await derive(String(input || ''), e.salt, e.iter || 150000);
    if (h === e.hash) { pwFails = 0; return 'ok'; }
    if (++pwFails >= 5) { pwLockUntil = Date.now() + 60000; pwFails = 0; }
    return 'bad';
  } catch (err) { console.warn(err); window.__lastPwErr = (err && (err.code || err.message)) || 'unknown'; return 'error'; }
}
async function changePassword(role, pw) {
  const data = { updatedAt: serverTimestamp() }; data[role] = await makeEntry(pw);
  await setDoc(cfgRef(), data, { merge: true });
}

/* ============ notices (same documents and fields the main app reads) ============ */
const normN = a => (Array.isArray(a) ? a : []).filter(x => x && x.id && x.title)
  .map(x => ({ id: String(x.id), title: String(x.title), body: String(x.body || ''), date: String(x.date || ''), active: x.active !== false }));
const sortN = () => N.list.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.id < b.id ? 1 : -1));
async function loadNotices() {
  const snap = await getFresh(cfgRef());
  const d = snap.exists() ? (snap.data() || {}) : {};
  N.list = normN(d.dcuNotices); sortN(); N.on = d.dcuTickerOn === true;
}
async function saveNotices() {
  await setDoc(cfgRef(), { dcuNotices: N.list, dcuTickerOn: !!N.on }, { merge: true });
  try {
    await setDoc(doc(db, 'site_public', PUB_ID), { ownerUid: user.uid, shopName: SHOP_NAME, notices: N.list.filter(n => n.active), tickerOn: !!N.on, updatedAt: serverTimestamp() });
    N.pubErr = false;
  } catch (e) { console.warn('public copy', e); N.pubErr = true; }
}

/* ============ header ============ */
function renderHeader() {
  $('#hTitle').textContent = t('title'); $('#hSub').textContent = t('sub');
  const r = $('#hRight');
  const isBn = lang() === 'bn';
  let h = '<button class="btn btn-sm" data-a="theme">' + esc(t('dark')) + '</button>'
        + '<button class="btn btn-sm" data-a="lang">' + (isBn ? 'English' : 'বাংলা') + '</button>'
        + '<a class="btn btn-sm" href="' + esc(MAIN_APP_URL) + '">' + esc(t('mainApp')) + '</a>';
  if (user && unlocked) h += '<button class="btn btn-sm" data-a="lock">' + esc(t('lock')) + '</button>';
  if (user) h += '<button class="btn btn-sm" data-a="logout">' + esc(t('logout')) + '</button>';
  r.innerHTML = h;
  document.documentElement.lang = isBn ? 'bn' : 'en'; document.title = t('title');
}
document.addEventListener('click', async e => {
  const b = e.target.closest && e.target.closest('[data-a]'); if (!b) return;
  const a = b.getAttribute('data-a');
  if (a === 'lang') { try { localStorage.setItem('rgce_lang', lang() === 'bn' ? 'en' : 'bn'); } catch (x) {} render(); }
  else if (a === 'theme') {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', nx);
    try { localStorage.setItem('rgce_admin_theme', nx); } catch (x) {}
  }
  else if (a === 'lock') lockPanel();
  else if (a === 'logout') { try { await signOut(auth); } catch (x) {} }
});
try { const th = localStorage.getItem('rgce_admin_theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}

/* ============ screens ============ */
function authMsg(e) {
  const c = (e && (e.code || e.message)) || 'unknown';
  console.error('[admin login]', c, e);
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials') return t('badLogin');
  if (c === 'auth/user-not-found') return t('noUser');
  if (c === 'auth/invalid-email') return t('badEmail');
  if (c === 'auth/user-disabled') return t('disabled');
  if (c === 'auth/too-many-requests') return t('tooMany');
  if (c === 'auth/network-request-failed') return t('netErr');
  if (/referer/i.test(c)) return t('refBlocked') + ' (' + c + ')';
  if (c === 'auth/unauthorized-domain') return t('badDomain') + ' (' + location.hostname + ')';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return t('badKey');
  return t('failCode') + c;
}
function render() {
  renderHeader();
  if (!booted) return;
  if (!user) return renderLogin();
  if (!unlocked) return renderGate();
  renderPanel();
}
function setMsg(id, m, cls) { const e = $('#' + id); if (e) { e.textContent = m || ''; e.className = 'msg' + (cls ? ' ' + cls : ''); } }

function renderLogin() {
  app.innerHTML = '<div class="card center"><h2>' + esc(t('loginH')) + '</h2><p class="muted">' + esc(t('loginP')) + '</p>'
    + '<div class="fg"><label for="lgE">' + esc(t('email')) + '</label><input id="lgE" type="email" autocomplete="username" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="fg"><label for="lgP">' + esc(t('pass')) + '</label><input id="lgP" type="password" autocomplete="current-password"></div>'
    + '<div class="msg" id="lgM" role="status"></div>'
    + '<button class="btn btn-primary" id="lgGo">' + esc(t('signin')) + '</button> '
    + '<button class="btn btn-sm" id="lgFg" type="button">' + esc(t('forgot')) + '</button></div>';
  const go = async () => {
    const em = $('#lgE').value.trim(), pw = $('#lgP').value;
    if (!em || !pw) { setMsg('lgM', t('needEmail')); return; }
    const btn = $('#lgGo'); btn.disabled = true; setMsg('lgM', '');
    try { await signInWithEmailAndPassword(auth, em, pw); }
    catch (e) { btn.disabled = false; setMsg('lgM', authMsg(e)); }
  };
  $('#lgGo').addEventListener('click', go);
  $('#lgP').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#lgE').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#lgFg').addEventListener('click', async () => {
    const em = $('#lgE').value.trim(); if (!em) { setMsg('lgM', t('resetNeed')); return; }
    try { await sendPasswordResetEmail(auth, em); setMsg('lgM', t('resetSent'), 'ok'); } catch (e) { setMsg('lgM', authMsg(e)); }
  });
  $('#lgE').focus();
}

function renderGate(note) {
  let lastErr = '';
  app.innerHTML = '<div class="card center"><h2>' + esc(t('gateH')) + '</h2><p class="muted">' + esc(t('gateP')) + '</p>'
    + '<div class="fg"><input id="gtP" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" data-lpignore="true" aria-label="' + esc(t('gateH')) + '"></div>'
    + '<div class="msg ' + (note ? 'warn' : '') + '" id="gtM" role="status">' + esc(note || '') + '</div>'
    + '<button class="btn btn-primary" id="gtGo">' + esc(t('gateBtn')) + '</button></div>';
  const go = async () => {
    const btn = $('#gtGo'); btn.disabled = true; setMsg('gtM', '');
    const r = await verifyMaster($('#gtP').value);
    btn.disabled = false; lastErr = window.__lastPwErr || '';
    if (r === 'ok') { unlocked = true; startIdle(); await openPanel(); return; }
    setMsg('gtM', r === 'locked' ? t('gateLocked') : r === 'nosetup' ? t('gateNone') : r === 'error' ? t('gateErr') + (lastErr ? ' (' + lastErr + ')' : '') : t('gateBad'));
    if (r === 'bad') { $('#gtP').value = ''; $('#gtP').focus(); }
  };
  $('#gtGo').addEventListener('click', go);
  $('#gtP').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#gtP').focus();
}

async function openPanel() {
  app.innerHTML = '<div class="card center" style="text-align:center"><span class="spin"></span></div>';
  renderHeader();
  let failed = false;
  try { await loadNotices(); } catch (e) { console.warn(e); failed = true; }
  tab = 'notices'; renderPanel();
  if (failed) setMsg('nMsg', t('loadFail'));
}

function renderPanel() {
  renderHeader();
  const tabs = [['notices', 'tNotices'], ['pass', 'tPass'], ['due', 'tDue'], ['account', 'tAccount']];
  app.innerHTML = '<div class="tabs" role="tablist">' + tabs.map(x => '<button class="tab" role="tab" data-tab="' + x[0] + '" aria-selected="' + (tab === x[0]) + '">' + esc(t(x[1])) + '</button>').join('') + '</div><div id="tabBody"></div>';
  app.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => { tab = b.getAttribute('data-tab'); renderPanel(); }));
  ({ notices: tabNotices, pass: tabPass, due: tabDue, account: tabAccount })[tab]();
}

/* ---------- tab: account ---------- */
function tabAccount() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('accH')) + '</h2><div class="kv" style="margin-top:12px">'
    + '<b>' + esc(t('accIn')) + '</b><span>' + esc(user.email || '') + '</span>'
    + '<b>' + esc(t('accUid')) + '</b><code>' + esc(user.uid) + '</code>'
    + '<b>' + esc(t('accCloud')) + '</b><span style="color:var(--success);font-weight:600">' + esc(t('accCloudV')) + '</span>'
    + '<b>' + esc(t('accScope')) + '</b><span>' + esc(t('accScopeV')) + '</span></div></div>';
}

/* ---------- tab: passwords ---------- */
function tabPass() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('chgH')) + '</h2>'
    + '<div class="fg" style="margin-top:12px"><label for="cgRole">' + esc(t('chgWhich')) + '</label><select id="cgRole"><option value="unlock">' + esc(t('chgUnlock')) + '</option><option value="danger">' + esc(t('chgDanger')) + '</option></select></div>'
    + '<div class="fg"><label for="cgP1">' + esc(t('chgNew')) + '</label><input id="cgP1" type="password" autocomplete="new-password"></div>'
    + '<div class="fg"><label for="cgP2">' + esc(t('chgNew2')) + '</label><input id="cgP2" type="password" autocomplete="new-password"></div>'
    + '<div class="msg" id="cgM" role="status"></div>'
    + '<button class="btn btn-primary" id="cgGo">' + esc(t('chgBtn')) + '</button><p class="muted" style="margin-top:14px">' + esc(t('chgNote')) + '</p></div>';
  $('#cgGo').addEventListener('click', async () => {
    const p1 = $('#cgP1').value, p2 = $('#cgP2').value;
    if (p1.length < 6) { setMsg('cgM', t('chgShort')); return; }
    if (p1 !== p2) { setMsg('cgM', t('chgMis')); return; }
    const btn = $('#cgGo'); btn.disabled = true;
    try { await changePassword($('#cgRole').value, p1); $('#cgP1').value = ''; $('#cgP2').value = ''; setMsg('cgM', t('chgOk'), 'ok'); }
    catch (e) { setMsg('cgM', t('chgFail') + ((e && e.message) || e)); }
    btn.disabled = false;
  });
}

/* ---------- tab: notices ---------- */
function tabNotices() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('admH')) + '</h2>'
    + '<label class="chk" style="margin-top:12px"><input type="checkbox" id="nTk"><span>' + esc(t('tkOn')) + '</span></label>'
    + '<div class="fg"><label for="nTitle">' + esc(t('admTitle')) + '</label><input id="nTitle" maxlength="140" autocomplete="off"></div>'
    + '<div class="fg"><label for="nBody">' + esc(t('admBody')) + '</label><textarea id="nBody" rows="4"></textarea></div>'
    + '<div class="fg"><label for="nDate">' + esc(t('admDate')) + '</label><input type="date" id="nDate"></div>'
    + '<button class="btn btn-primary" id="nSave">' + esc(t('admPub')) + '</button> <button class="btn" id="nCancel" hidden>' + esc(t('admCancel')) + '</button>'
    + '<div class="msg" id="nMsg" role="status"></div><div id="nList"></div></div>';
  $('#nTk').checked = !!N.on; resetForm(); renderList();
  const done = () => setMsg('nMsg', N.pubErr ? t('pubNoRule') : t('saved'), N.pubErr ? 'warn' : 'ok');
  $('#nTk').addEventListener('change', async e => {
    const prev = N.on; N.on = e.target.checked;
    try { await saveNotices(); done(); } catch (x) { console.warn(x); N.on = prev; e.target.checked = prev; setMsg('nMsg', t('saveFail')); }
  });
  $('#nSave').addEventListener('click', async () => {
    const title = $('#nTitle').value.trim(), body = $('#nBody').value.trim(), date = $('#nDate').value || todayStr();
    if (!title) { setMsg('nMsg', t('needTitle')); return; }
    const btn = $('#nSave'); btn.disabled = true;
    const backup = JSON.stringify(N.list);
    if (N.editing) { const n = N.list.find(x => x.id === N.editing); if (n) { n.title = title; n.body = body; n.date = date; } }
    else N.list.push({ id: 'n' + Date.now().toString(36), title, body, date, active: true });
    sortN();
    try { await saveNotices(); done(); resetForm(); }
    catch (x) { console.warn(x); N.list = JSON.parse(backup); setMsg('nMsg', t('saveFail')); }
    btn.disabled = false; renderList();
  });
  $('#nCancel').addEventListener('click', () => { resetForm(); setMsg('nMsg', ''); });
  $('#nList').addEventListener('click', async e => {
    const b = e.target.closest && e.target.closest('[data-an]'); if (!b) return;
    const id = b.getAttribute('data-nid'), act = b.getAttribute('data-an'), n = N.list.find(x => x.id === id); if (!n) return;
    if (act === 'edit') { N.editing = id; $('#nTitle').value = n.title; $('#nBody').value = n.body; $('#nDate').value = n.date || todayStr(); $('#nSave').textContent = t('admUpd'); $('#nCancel').hidden = false; $('#nTitle').focus(); return; }
    const backup = JSON.stringify(N.list);
    if (act === 'toggle') n.active = !n.active;
    if (act === 'del') { if (!confirm(t('confirmDel'))) return; N.list = N.list.filter(x => x.id !== id); if (N.editing === id) resetForm(); }
    try { await saveNotices(); done(); } catch (x) { console.warn(x); N.list = JSON.parse(backup); setMsg('nMsg', t('saveFail')); }
    renderList();
  });
}
function resetForm() {
  N.editing = '';
  const a = $('#nTitle'), b = $('#nBody'), d = $('#nDate'), s = $('#nSave'), c = $('#nCancel');
  if (a) a.value = ''; if (b) b.value = ''; if (d) d.value = todayStr(); if (s) s.textContent = t('admPub'); if (c) c.hidden = true;
}
function renderList() {
  const box = $('#nList'); if (!box) return;
  if (!N.list.length) { box.innerHTML = '<div class="row"><span class="muted">' + esc(t('admNone')) + '</span></div>'; return; }
  box.innerHTML = N.list.map(n =>
    '<div class="row"><div class="t"><b>' + esc(n.title) + '<span class="chip ' + (n.active ? 'on' : '') + '">' + esc(n.active ? t('stPub') : t('stHid')) + '</span></b><small>' + esc(fmtDate(n.date)) + '</small></div>'
    + '<div class="acts"><button class="btn btn-sm" data-an="toggle" data-nid="' + esc(n.id) + '">' + esc(n.active ? t('hide') : t('show')) + '</button>'
    + '<button class="btn btn-sm" data-an="edit" data-nid="' + esc(n.id) + '">' + esc(t('edit')) + '</button>'
    + '<button class="btn btn-sm btn-danger" data-an="del" data-nid="' + esc(n.id) + '">' + esc(t('del')) + '</button></div></div>').join('');
}

/* ---------- tab: public due status ---------- */
async function tabDue() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('dueH')) + '</h2><p class="muted">' + esc(t('dueNote')) + '</p>'
    + '<div class="kv" style="margin:14px 0"><b>' + esc(t('dueCount')) + '</b><span class="big" id="dCount">…</span><b>' + esc(t('dueAt')) + '</b><span id="dAt">…</span></div>'
    + '<div class="msg" id="dMsg" role="status"></div><button class="btn btn-sm" id="dRef">' + esc(t('dueRefresh')) + '</button>'
    + '<h3>' + esc(t('dueRules')) + '</h3><textarea class="rules" id="dRules" readonly></textarea>'
    + '<div style="margin-top:8px"><button class="btn btn-sm" id="dCopy">' + esc(t('dueCopy')) + '</button></div></div>';
  $('#dRules').value = RULES_TEXT;
  $('#dCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(RULES_TEXT); } catch (e) { $('#dRules').select(); document.execCommand('copy'); } setMsg('dMsg', t('dueCopied'), 'ok'); });
  const load = async () => {
    setMsg('dMsg', '');
    try {
      const snap = await getFresh(cfgRef()); const d = snap.exists() ? (snap.data() || {}) : {};
      const ids = Array.isArray(d.dcuDueIds) ? d.dcuDueIds.length : 0;
      if ($('#dCount')) $('#dCount').textContent = ids;
      if ($('#dAt')) {
        if (d.dcuDueAt) { const x = new Date(d.dcuDueAt); $('#dAt').textContent = fmtDate(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate())) + ' ' + pad(x.getHours()) + ':' + pad(x.getMinutes()); }
        else $('#dAt').textContent = ids ? '—' : t('dueNever');
      }
    } catch (e) { console.warn(e); if ($('#dCount')) $('#dCount').textContent = '—'; setMsg('dMsg', t('dueFail')); }
  };
  $('#dRef').addEventListener('click', load); load();
}

/* ============ lock / idle ============ */
function lockPanel(msg) {
  unlocked = false; clearTimeout(idleTimer); N = { list: [], on: false, editing: '', pubErr: false };
  render(); if (msg && user) renderGate(msg);
}
let idleBound = false;
const bumpIdle = () => { clearTimeout(idleTimer); if (unlocked) idleTimer = setTimeout(() => lockPanel(t('idle')), AUTO_LOCK_MIN * 60000); };
function startIdle() {
  if (!idleBound) { idleBound = true; ['click', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, bumpIdle, { passive: true })); }
  bumpIdle();
}

/* ============ start ============ */
setTimeout(() => { if (!booted) { app.innerHTML = '<div class="card center"><p class="msg">' + esc(t('sdkFail')) + '</p></div>'; } }, 12000);
onAuthStateChanged(auth, u => {
  booted = true;
  const changed = (u && u.uid) !== (user && user.uid);
  user = u || null;
  if (changed || !user) unlocked = false;
  render();
});
</script>
</body>
