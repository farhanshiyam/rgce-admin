/* ============ password helpers (identical scheme to the main app: salted PBKDF2 hashes in private_config/<uid>) ============ */
const cfgRef = () => doc(db, 'private_config', user.uid);
const b64 = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
  return b64(new Uint8Array(bits));
}
async function makeEntry(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000;
  return { salt, iter, hash: await derive(pw, salt, iter) };
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);

/* ============ screens ============ */
function authMsg(e) {
  const c = (e && (e.code || e.message)) || 'unknown';
  console.error('[admin login]', c, e);
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials') return t('badLogin');
  if (c === 'auth/user-not-found') return t('noUser');
  if (c === 'auth/invalid-email') return t('badEmail');
  if (c === 'auth/user-disabled') return t('disabled');
  if (c === 'auth/too-many-requests') return t('tooMany');
  if (c === 'auth/network-request-failed' || c === 'timeout') return t('netErr');
  if (/referer/i.test(c)) return t('refBlocked') + ' (' + c + ')';
  if (c === 'auth/unauthorized-domain') return t('badDomain') + ' (' + location.hostname + ')';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return t('badKey');
  return t('failCode') + c;
}
/* ============ access key gate (second step after email + password) ============ */
/* Only a salted SHA-256 hash of the key is stored here, not the key itself. This is a screen lock, not server-side security. */
const KEY_SALT = 'rgce-admin|', KEY_HASH = '0031658ef358e05afcb041e8efdb647d88dfa770a338605cd14403e6cd0ab445';
let unlocked = false, gateFails = 0, gateUntil = 0;
const sessGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const sessSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const sessDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const bnDigits = v => String(v).replace(/[\u09E6-\u09EF]/g, d => String(d.charCodeAt(0) - 0x09E6));
async function sha256Hex(str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function renderGate() {
  app.innerHTML = '<div class="card center"><h2>' + esc(t('gateH')) + '</h2><p class="muted">' + esc(t('gateP')) + '</p>'
    + '<table class="keytbl"><tbody><tr><th scope="row"><label for="gkIn">' + esc(t('gateKey')) + '</label></th>'
    + '<td><input id="gkIn" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false"></td></tr></tbody></table>'
    + '<div class="msg" id="gkM" role="status"></div><button class="btn btn-primary" id="gkGo" type="button">' + esc(t('gateBtn')) + '</button></div>';
  const go = async () => {
    if (Date.now() < gateUntil) { setMsg('gkM', t('gateLocked')); return; }
    const v = bnDigits($('#gkIn').value.trim()); if (!v) return;
    const btn = $('#gkGo'); btn.disabled = true; setMsg('gkM', '');
    let ok = false;
    try { ok = (await sha256Hex(KEY_SALT + v)) === KEY_HASH; }
    catch (e) { console.warn(e); btn.disabled = false; setMsg('gkM', t('gateErr')); return; }
    if (ok) { gateFails = 0; unlocked = true; sessSet('rgce_adm_ok', user.uid); openPanel(); return; }
    gateFails++;
    if (gateFails >= 5) { gateFails = 0; gateUntil = Date.now() + 60000; setMsg('gkM', t('gateLocked')); } else setMsg('gkM', t('gateBad'));
    $('#gkIn').value = ''; btn.disabled = false; $('#gkIn').focus();
  };
  $('#gkGo').addEventListener('click', go);
  $('#gkIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#gkIn').focus();
}

    } catch (e) { console.warn(e); setMsg('rpMsg', rl('rFail')); }
  };
  $('#rpGo').addEventListener('click', gen); $('#rpRef').addEventListener('click', load);
  $('#rpPr').addEventListener('click', async () => {
    if (!rpHtml || !rpDoc) return; const b = $('#rpPr'); b.disabled = true; setMsg('rpMsg', '');
    try {
      const url = REPORT_VIEW_URL + '?r=' + rpDoc.id;
      if (!rpSaved) {
        await setDoc(doc(db, 'site_public', 'rpt-' + rpDoc.id), { ownerUid: user.uid, shopName: SHOP_NAME, typeId: rpDoc.typeId, g: rpDoc.g, notes: rpDoc.notes, gen: rpDoc.gen, no: rpDoc.no, lang: lang(), count: rpDoc.rows.length, gt: rpDoc.gt,
          rows: rpDoc.rows.map(r => ({ n: r.name, p: r.phone, a: r.addr, s: r.src, d: r.due, u: r.paid })), expiresAt: Date.now() + 60 * 864e5, createdAt: serverTimestamp() });
        rpSaved = true;
      }
      $('#rpLink').innerHTML = esc(rl('rLink')) + ': <a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
      printHtml(rpHtml, rpName);
    } catch (e) { console.warn(e); setMsg('rpMsg', rl('rSaveFail') + ' [' + ((e && e.code) || (e && e.message) || 'error') + ']'); }
    if ($('#rpPr')) $('#rpPr').disabled = false;
  });
  load();
}

/* ---------- tab: passwords ---------- */
function tabPass() {

    + '<div class="fg" style="margin-top:12px"><label for="cgRole">' + esc(t('chgWhich')) + '</label><select id="cgRole"><option value="unlock">' + esc(t('chgUnlock')) + '</option><option value="danger">' + esc(t('chgDanger')) + '</option></select></div>'
    + '<div class="fg"><label for="cgP1">' + esc(t('chgNew')) + '</label><input id="cgP1" type="password" autocomplete="new-password"></div>'
    + '<div class="fg"><label for="cgP2">' + esc(t('chgNew2')) + '</label><input id="cgP2" type="password" autocomplete="new-password"></div>'
    + '<div class="msg" id="cgM" role="status"></div>'
    + '<button class="btn btn-primary" id="cgGo">' + esc(t('chgBtn')) + '</button><p class="muted" style="margin-top:14px">' + esc(t('chgNote')) + '</p></div>';
  $('#cgGo').addEventListener('click', async () => {
    const p1 = $('#cgP1').value, p2 = $('#cgP2').value;

    catch (e) { setMsg('cgM', t('chgFail') + ((e && e.message) || e)); }

  });
}

/* ---------- tab: notices ---------- */
async function tabNotices() {
  if (N.loaded) { buildNotices(); return; }
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('admH')) + '</h2><div style="margin-top:12px"><span class="spin"></span></div></div>';
  let ok = false;
  try { await loadNotices(); ok = true; } catch (e) { console.warn(e); }
  if (tab !== 'notices' || !$('#tabBody')) return;
  if (ok) { buildNotices(); return; }
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('admH')) + '</h2><div class="msg" role="status">' + esc(t('loadFail')) + '</div><button class="btn btn-sm" id="nRetry">' + esc(t('dueRefresh')) + '</button></div>';
  $('#nRetry').addEventListener('click', tabNotices);
}
function buildNotices() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('admH')) + '</h2>'
    + '<label class="chk" style="margin-top:12px"><input type="checkbox" id="nTk"><span>' + esc(t('tkOn')) + '</span></label>'
    + '<div class="fg"><label for="nTitle">' + esc(t('admTitle')) + '</label><input id="nTitle" maxlength="140" autocomplete="off"></div>'
    + '<div class="fg"><label for="nBody">' + esc(t('admBody')) + '</label><textarea id="nBody" rows="4"></textarea></div>'
    + '<div class="fg"><label for="nDate">' + esc(t('admDate')) + '</label><input type="date" id="nDate"></div>'
    + '<button class="btn btn-primary" id="nSave">' + esc(t('admPub')) + '</button> <button class="btn" id="nCancel" hidden>' + esc(t('admCancel')) + '</button>'
    + '<div class="msg" id="nMsg" role="status"></div><div id="nList"></div>'
    + '<h3>' + esc(t('nBackup')) + '</h3><button class="btn btn-sm" id="nExp">' + esc(t('nExport')) + '</button> <button class="btn btn-sm" id="nImp">' + esc(t('nImport')) + '</button><input type="file" id="nFile" accept="application/json,.json" hidden></div>';
  $('#nTk').checked = !!N.on; resetForm(); renderList();
  const done = () => setMsg('nMsg', N.pubErr ? t('pubNoRule') : t('saved'), N.pubErr ? 'warn' : 'ok');
  $('#nTk').addEventListener('change', async e => {
    const prev = N.on; N.on = e.target.checked;
    try { await saveNotices(); done(); } catch (x) { console.warn(x); N.on = prev; e.target.checked = prev; setMsg('nMsg', t('saveFail')); }
  });
  $('#nSave').addEventListener('click', async () => {
    const title = $('#nTitle').value.trim(), body = $('#nBody').value.trim(), date = $('#nDate').value || todayStr();
    if (!title) { setMsg('nMsg', t('needTitle')); return; }
    const btn = $('#nSave'); btn.disabled = true;
    const backup = JSON.stringify(N.list);
    if (N.editing) { const n = N.list.find(x => x.id === N.editing); if (n) { n.title = title; n.body = body; n.date = date; } }
    else N.list.push({ id: 'n' + Date.now().toString(36), title, body, date, active: true });
    sortN();
    try { await saveNotices(); done(); resetForm(); }
    catch (x) { console.warn(x); N.list = JSON.parse(backup); setMsg('nMsg', t('saveFail')); }
    btn.disabled = false; renderList();
  });
  $('#nCancel').addEventListener('click', () => { resetForm(); setMsg('nMsg', ''); });
  $('#nExp').addEventListener('click', () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'rgce-notices', ticker: !!N.on, notices: N.list }, null, 2)], { type: 'application/json' }));
    a.download = 'rgce-notices-' + todayStr() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('#nImp').addEventListener('click', () => $('#nFile').click());
  $('#nFile').addEventListener('change', async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (x) { setMsg('nMsg', t('nImpBad')); return; }
    const list = normN(Array.isArray(data) ? data : (data && data.notices));
    if (!list.length) { setMsg('nMsg', t('nImpBad')); return; }
    if (!confirm(t('nImpAsk').replace('{n}', N.list.length).replace('{m}', list.length))) return;
    const backup = JSON.stringify(N.list); N.list = list; sortN(); resetForm();
    try { await saveNotices(); setMsg('nMsg', N.pubErr ? t('pubNoRule') : t('nImpOk'), N.pubErr ? 'warn' : 'ok'); }
    catch (x) { console.warn(x); N.list = JSON.parse(backup); setMsg('nMsg', t('saveFail')); }
    renderList();
  });
  $('#nList').addEventListener('click', async e => {
    const b = e.target.closest && e.target.closest('[data-an]'); if (!b) return;
    const id = b.getAttribute('data-nid'), act = b.getAttribute('data-an'), n = N.list.find(x => x.id === id); if (!n) return;
    if (act === 'edit') { N.editing = id; $('#nTitle').value = n.title; $('#nBody').value = n.body; $('#nDate').value = n.date || todayStr(); $('#nSave').textContent = t('admUpd'); $('#nCancel').hidden = false; $('#nTitle').focus(); return; }
    const backup = JSON.stringify(N.list);
    if (act === 'toggle') n.active = !n.active;
    if (act === 'del') { if (!confirm(t('confirmDel'))) return; N.list = N.list.filter(x => x.id !== id); if (N.editing === id) resetForm(); }
    try { await saveNotices(); done(); } catch (x) { console.warn(x); N.list = JSON.parse(backup); setMsg('nMsg', t('saveFail')); }
    renderList();
  });
}
function resetForm() {
  N.editing = '';
  const a = $('#nTitle'), b = $('#nBody'), d = $('#nDate'), s = $('#nSave'), c = $('#nCancel');
  if (a) a.value = ''; if (b) b.value = ''; if (d) d.value = todayStr(); if (s) s.textContent = t('admPub'); if (c) c.hidden = true;
}
function renderList() {
  const box = $('#nList'); if (!box) return;
  if (!N.list.length) { box.innerHTML = '<div class="row"><span class="muted">' + esc(t('admNone')) + '</span></div>'; return; }
  box.innerHTML = N.list.map(n =>
    '<div class="row"><div class="t"><b>' + esc(n.title) + '<span class="chip ' + (n.active ? 'on' : '') + '">' + esc(n.active ? t('stPub') : t('stHid')) + '</span></b><small>' + esc(fmtDate(n.date)) + '</small></div>'
    + '<div class="acts"><button class="btn btn-sm" data-an="toggle" data-nid="' + esc(n.id) + '">' + esc(n.active ? t('hide') : t('show')) + '</button>'
    + '<button class="btn btn-sm" data-an="edit" data-nid="' + esc(n.id) + '">' + esc(t('edit')) + '</button>'
    + '<button class="btn btn-sm btn-danger" data-an="del" data-nid="' + esc(n.id) + '">' + esc(t('del')) + '</button></div></div>').join('');
}

/* ---------- tab: public due status ---------- */
let dueOff = false, dueIds = [];
async function tabDue() {
  $('#tabBody').innerHTML = '<div class="card"><h2>' + esc(t('dueH')) + '</h2><p class="muted">' + esc(t('dueNote')) + '</p>'
    + '<div class="kv" style="margin:14px 0"><b>' + esc(t('dueState')) + '</b><span><span class="pill" id="dState">…</span></span><b>' + esc(t('dueCount')) + '</b><span class="big" id="dCount">…</span><b>' + esc(t('dueAt')) + '</b><span id="dAt">…</span></div>'
    + '<div class="msg" id="dMsg" role="status"></div><button class="btn btn-sm" id="dRef">' + esc(t('dueRefresh')) + '</button> <button class="btn btn-sm" id="dSwitch" disabled>…</button>'
    + '<h3>' + esc(t('dueRules')) + '</h3><textarea class="rules" id="dRules" readonly></textarea>'
    + '<div style="margin-top:8px"><button class="btn btn-sm" id="dCopy">' + esc(t('dueCopy')) + '</button></div></div>';
  $('#dRules').value = RULES_TEXT;
  $('#dCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(RULES_TEXT); } catch (e) { $('#dRules').select(); document.execCommand('copy'); } setMsg('dMsg', t('dueCopied'), 'ok'); });
  const load = async (keep) => {
    if (keep !== true) setMsg('dMsg', '');
    try {
      const snap = await getFresh(cfgRef()); const d = snap.exists() ? (snap.data() || {}) : {};
      const ids = Array.isArray(d.dcuDueIds) ? d.dcuDueIds.length : 0;
      dueOff = d.dcuDueOff === true; dueIds = Array.isArray(d.dcuDueIds) ? d.dcuDueIds : [];
      const ps = $('#dState'); if (ps) { ps.textContent = t(dueOff ? 'dueOff' : 'dueOn'); ps.className = 'pill ' + (dueOff ? 'off' : 'on'); }
      const sw = $('#dSwitch'); if (sw) { sw.textContent = t(dueOff ? 'dueTurnOn' : 'dueTurnOff'); sw.disabled = false; sw.className = 'btn btn-sm' + (dueOff ? '' : ' btn-danger'); }
      if ($('#dCount')) $('#dCount').textContent = ids;
      if ($('#dAt')) {
        if (d.dcuDueAt) { const x = new Date(d.dcuDueAt); $('#dAt').textContent = fmtDate(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate())) + ' ' + pad(x.getHours()) + ':' + pad(x.getMinutes()); }
        else $('#dAt').textContent = ids ? '—' : t('dueNever');
      }
    } catch (e) { console.warn(e); if ($('#dCount')) $('#dCount').textContent = '—'; setMsg('dMsg', t('dueFail')); }
  };
  $('#dRef').addEventListener('click', () => load());
  $('#dSwitch').addEventListener('click', async () => {
    const sw = $('#dSwitch'); sw.disabled = true; setMsg('dMsg', '');
    try {
      if (dueOff) { await setDoc(cfgRef(), { dcuDueOff: false }, { merge: true }); setMsg('dMsg', t('dueOnDone'), 'ok'); }
      else {
        if (!confirm(t('dueOffAsk'))) { sw.disabled = false; return; }
        await setDoc(cfgRef(), { dcuDueOff: true }, { merge: true });          // set the stop flag first so the main app cannot republish
        for (let k = 0; k < dueIds.length; k += 400) { const b = writeBatch(db); dueIds.slice(k, k + 400).forEach(id => b.delete(doc(db, 'public_dues', id))); await b.commit(); }
        await setDoc(cfgRef(), { dcuDueIds: [] }, { merge: true });
        setMsg('dMsg', t('dueOffDone'), 'ok');
      }
    } catch (e) { console.warn(e); setMsg('dMsg', t('saveFail') + ((e && e.code) ? ' (' + e.code + ')' : '')); }
    await load(true);
  });
  load();
}

/* ============ start ============ */
onAuthStateChanged(auth, u => {
  booted = true; window.__rgceBooted = true; try { sessionStorage.removeItem('rgce_adm_try'); sessionStorage.removeItem('rgce_adm_heal'); } catch (x) {}
  const changed = (u && u.uid) !== (user && user.uid);
  user = u || null;
  unlocked = !!(user && sessGet('rgce_adm_ok') === user.uid);
  if (!user) sessDel('rgce_adm_ok');
  if (!user) { N = { list: [], on: false, editing: '', pubErr: false, loaded: false }; render(); }
  else if (changed) openPanel();
  else render();
});
</script>
