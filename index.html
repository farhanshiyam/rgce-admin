    btn:  ['Reload', 'রিলোড']
  };
  window.__bootFail = function (kind) {
    var i = 0; try { i = localStorage.getItem('rgce_lang') === 'bn' ? 1 : 0; } catch (e) {}
    var app = document.getElementById('app'); if (!app) return;
    app.innerHTML = '';

    card.appendChild(p); card.appendChild(b); app.appendChild(card);
  };
  window.addEventListener('online', function () { if (!window.__rgceBooted) location.reload(); });   // internet came back -> try again
  setTimeout(function () {                                   // SDK loaded but startup is stuck: drop this panel's saved session, reload once
    if (window.__rgceBooted || !window.__rgceSdk) return;
    var done = false; try { done = sessionStorage.getItem('rgce_adm_heal') === '1'; } catch (e) {}

    location.reload();
  }, 10000);
  setTimeout(function () { if (!window.__rgceBooted) window.__bootFail(window.__rgceSdk ? 'slow' : 'sdk'); }, 24000);
})();

const fmtDT = v => { if (!v) return '—'; const x = new Date(v.toDate ? v.toDate() : v); if (isNaN(x)) return '—'; return fmtDate(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate())) + ' ' + pad(x.getHours()) + ':' + pad(x.getMinutes()); };
const money = n => Math.round(n).toLocaleString('en-US');   // BDT amounts, shown without a currency icon

/* ============ password helpers (identical scheme to the main app: salted PBKDF2 hashes in private_config/<uid>) ============ */
const cfgRef = () => doc(db, 'private_config', user.uid);
const b64 = bytes => { let s = ''; bytes.forEach(b => { s += String.fromCharCode(b); }); return btoa(s); };
async function derive(pw, saltB64, iter) {
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pw)), 'PBKDF2', false, ['deriveBits']);
  const salt = Uint8Array.from(atob(saltB64), c => c.charCodeAt(0));
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' }, key, 256);
  return b64(new Uint8Array(bits));
}
async function makeEntry(pw) {
  const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 150000;
  return { salt, iter, hash: await derive(pw, salt, iter) };
}
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
async function getFresh(ref) {
  try { return await withTimeout(getDocFromServer(ref), 10000); }
  catch (e) { if (e && e.code === 'permission-denied') throw e; return await withTimeout(getDoc(ref), 8000); }
}
async function changePassword(role, pw) {
  const data = { updatedAt: serverTimestamp() }; data[role] = await makeEntry(pw);
  await setDoc(cfgRef(), data, { merge: true });
}

const normN = a => (Array.isArray(a) ? a : []).filter(x => x && x.id && x.title)
  .map(x => ({ id: String(x.id), title: String(x.title), body: String(x.body || ''), date: String(x.date || ''), active: x.active !== false }));
const sortN = () => N.list.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (a.id < b.id ? 1 : -1));
async function loadNotices() {
  const snap = await getFresh(cfgRef());
  const d = snap.exists() ? (snap.data() || {}) : {};
  N.list = normN(d.dcuNotices); sortN(); N.on = d.dcuTickerOn === true; N.loaded = true;
}
async function saveNotices() {
  if (!N.loaded) throw new Error('notices not loaded');   // never overwrite the cloud list with an empty one
  await setDoc(cfgRef(), { dcuNotices: N.list, dcuTickerOn: !!N.on }, { merge: true });
  try {
    await setDoc(doc(db, 'site_public', PUB_ID), { ownerUid: user.uid, shopName: SHOP_NAME, notices: N.list.filter(n => n.active), tickerOn: !!N.on, updatedAt: serverTimestamp() });

}

/* ============ screens ============ */
function authMsg(e) {
  const c = (e && (e.code || e.message)) || 'unknown';
  console.error('[admin login]', c, e);
  if (c === 'auth/invalid-credential' || c === 'auth/wrong-password' || c === 'auth/invalid-login-credentials') return t('badLogin');
  if (c === 'auth/user-not-found') return t('noUser');
  if (c === 'auth/invalid-email') return t('badEmail');
  if (c === 'auth/user-disabled') return t('disabled');
  if (c === 'auth/too-many-requests') return t('tooMany');
  if (c === 'auth/network-request-failed' || c === 'timeout') return t('netErr');
  if (/referer/i.test(c)) return t('refBlocked') + ' (' + c + ')';
  if (c === 'auth/unauthorized-domain') return t('badDomain') + ' (' + location.hostname + ')';
  if (c === 'auth/invalid-api-key' || c === 'auth/api-key-not-valid.-please-pass-a-valid-api-key.') return t('badKey');
  return t('failCode') + c;
}
/* ============ access key gate (second step after email + password) ============ */
/* Only a salted SHA-256 hash of the key is stored here, not the key itself. This is a screen lock, not server-side security. */
const KEY_SALT = 'rgce-admin|', KEY_HASH = '0031658ef358e05afcb041e8efdb647d88dfa770a338605cd14403e6cd0ab445';
let unlocked = false, gateFails = 0, gateUntil = 0;
const sessGet = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };
const sessSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch (e) {} };
const sessDel = k => { try { sessionStorage.removeItem(k); } catch (e) {} };
const bnDigits = v => String(v).replace(/[\u09E6-\u09EF]/g, d => String(d.charCodeAt(0) - 0x09E6));
async function sha256Hex(str) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
function renderGate() {
  app.innerHTML = '<div class="card center"><h2>' + esc(t('gateH')) + '</h2><p class="muted">' + esc(t('gateP')) + '</p>'
    + '<table class="keytbl"><tbody><tr><th scope="row"><label for="gkIn">' + esc(t('gateKey')) + '</label></th>'
    + '<td><input id="gkIn" type="password" inputmode="numeric" autocomplete="off" autocapitalize="off" spellcheck="false"></td></tr></tbody></table>'
    + '<div class="msg" id="gkM" role="status"></div><button class="btn btn-primary" id="gkGo" type="button">' + esc(t('gateBtn')) + '</button></div>';
  const go = async () => {
    if (Date.now() < gateUntil) { setMsg('gkM', t('gateLocked')); return; }
    const v = bnDigits($('#gkIn').value.trim()); if (!v) return;
    const btn = $('#gkGo'); btn.disabled = true; setMsg('gkM', '');
    let ok = false;
    try { ok = (await sha256Hex(KEY_SALT + v)) === KEY_HASH; }
    catch (e) { console.warn(e); btn.disabled = false; setMsg('gkM', t('gateErr')); return; }
    if (ok) { gateFails = 0; unlocked = true; sessSet('rgce_adm_ok', user.uid); openPanel(); return; }
    gateFails++;
    if (gateFails >= 5) { gateFails = 0; gateUntil = Date.now() + 60000; setMsg('gkM', t('gateLocked')); } else setMsg('gkM', t('gateBad'));
    $('#gkIn').value = ''; btn.disabled = false; $('#gkIn').focus();
  };
  $('#gkGo').addEventListener('click', go);
  $('#gkIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  $('#gkIn').focus();
}

  $('#dCopy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(RULES_TEXT); } catch (e) { $('#dRules').select(); document.execCommand('copy'); } setMsg('dMsg', t('dueCopied'), 'ok'); });
  const load = async (keep) => {
    if (keep !== true) setMsg('dMsg', '');
    try {
      const snap = await getFresh(cfgRef()); const d = snap.exists() ? (snap.data() || {}) : {};
      const ids = Array.isArray(d.dcuDueIds) ? d.dcuDueIds.length : 0;
      dueOff = d.dcuDueOff === true; dueIds = Array.isArray(d.dcuDueIds) ? d.dcuDueIds : [];
      const ps = $('#dState'); if (ps) { ps.textContent = t(dueOff ? 'dueOff' : 'dueOn'); ps.className = 'pill ' + (dueOff ? 'off' : 'on'); }
      const sw = $('#dSwitch'); if (sw) { sw.textContent = t(dueOff ? 'dueTurnOn' : 'dueTurnOff'); sw.disabled = false; sw.className = 'btn btn-sm' + (dueOff ? '' : ' btn-danger'); }
      if ($('#dCount')) $('#dCount').textContent = ids;
      if ($('#dAt')) {
        if (d.dcuDueAt) { const x = new Date(d.dcuDueAt); $('#dAt').textContent = fmtDate(x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate())) + ' ' + pad(x.getHours()) + ':' + pad(x.getMinutes()); }
        else $('#dAt').textContent = ids ? '—' : t('dueNever');
      }
    } catch (e) { console.warn(e); if ($('#dCount')) $('#dCount').textContent = '—'; setMsg('dMsg', t('dueFail')); }
  };
  $('#dRef').addEventListener('click', () => load());
  $('#dSwitch').addEventListener('click', async () => {
    const sw = $('#dSwitch'); sw.disabled = true; setMsg('dMsg', '');
    try {
      if (dueOff) { await setDoc(cfgRef(), { dcuDueOff: false }, { merge: true }); setMsg('dMsg', t('dueOnDone'), 'ok'); }
      else {
        if (!confirm(t('dueOffAsk'))) { sw.disabled = false; return; }
        await setDoc(cfgRef(), { dcuDueOff: true }, { merge: true });          // set the stop flag first so the main app cannot republish
        for (let k = 0; k < dueIds.length; k += 400) { const b = writeBatch(db); dueIds.slice(k, k + 400).forEach(id => b.delete(doc(db, 'public_dues', id))); await b.commit(); }
        await setDoc(cfgRef(), { dcuDueIds: [] }, { merge: true });
        setMsg('dMsg', t('dueOffDone'), 'ok');
      }
    } catch (e) { console.warn(e); setMsg('dMsg', t('saveFail') + ((e && e.code) ? ' (' + e.code + ')' : '')); }
    await load(true);
  });
  load();
}

/* ============ start ============ */
onAuthStateChanged(auth, u => {
  booted = true; window.__rgceBooted = true; try { sessionStorage.removeItem('rgce_adm_try'); sessionStorage.removeItem('rgce_adm_heal'); } catch (x) {}
  const changed = (u && u.uid) !== (user && user.uid);
  user = u || null;
  unlocked = !!(user && sessGet('rgce_adm_ok') === user.uid);
  if (!user) sessDel('rgce_adm_ok');
  if (!user) { N = { list: [], on: false, editing: '', pubErr: false, loaded: false }; render(); }
  else if (changed) openPanel();
  else render();
});
</script>
